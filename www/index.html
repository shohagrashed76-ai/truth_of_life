<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Reader</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Top Header -->
    <header class="reader-header">
        <div class="h-left">
            <i class="fa-solid fa-arrow-left"></i>
            <select id="surahSelect" onchange="loadSurah(this.value)">
                <!-- 114 Surahs will load here -->
            </select>
        </div>
        <div class="h-right">
            <i class="fa-solid fa-circle-info"></i>
            <i class="fa-solid fa-gear"></i>
        </div>
    </header>

    <div class="reading-goal-bar">
        <span id="surahEnglishMeaning">The Opener</span>
        <span>Reading goal: 0/5 mins <i class="fa-regular fa-circle"></i></span>
    </div>

    <!-- Surah Header Banner -->
    <div class="surah-banner-container">
        <div class="surah-banner">
            <h1 id="surahArabicTitle">الفاتحة</h1>
        </div>
    </div>

    <!-- Ayats Container -->
    <main class="ayats-list" id="ayatsContainer">
        <p style="text-align:center; padding:20px; color:#aaa;">আয়াত লোড হচ্ছে...</p>
    </main>

    <!-- Floating Audio Player Bar -->
    <div class="floating-audio-player">
        <button class="play-btn" id="playBtn" onclick="togglePlay()"><i class="fa-solid fa-play"></i></button>
        <div class="reciter-info">
            <span class="track-title" id="audioTrackTitle">Surah Player</span>
            <span class="reciter-name">Mishary Rashid Alafasy</span>
        </div>
        <div class="player-controls">
            <span class="speed">1x</span>
            <i class="fa-solid fa-backward-step" onclick="prevSurah()"></i>
            <i class="fa-solid fa-forward-step" onclick="nextSurah()"></i>
        </div>
    </div>

    <audio id="quranAudio"></audio>

    <script src="script.js"></script>
</body>
</html>
