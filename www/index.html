<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muslim Pro Style App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Date Navigation Header -->
    <div class="date-picker-bar">
        <div class="date-info">
            <h2 id="display-date">Today, 18 September</h2>
            <p id="display-hijri">5 Rabi' II 1448 AH</p>
        </div>
        <div class="date-controls">
            <button onclick="changeDate(-1)"><i class="fa-solid fa-chevron-left"></i></button>
            <button onclick="changeDate(1)"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </div>

    <!-- Mark All Card -->
    <div class="card tracker-card">
        <div class="tracker-left">
            <strong>Mark all as prayed</strong>
            <p id="tracker-status">0/5 tracked</p>
        </div>
        <i class="fa-regular fa-circle-check check-all" onclick="toggleMarkAll()"></i>
    </div>

    <!-- Location Pill -->
    <div class="location-pill">
        <span><i class="fa-solid fa-location-dot"></i> Kaliganj</span>
    </div>

    <!-- Prayer Times List -->
    <main class="prayer-container" id="prayer-list">
        <div class="p-row"><span>Fajr ✨</span><strong id="time-fajr">--:--</strong></div>
        <div class="p-row"><span>Sunrise ☀️</span><strong id="time-sunrise">--:--</strong></div>
        <div class="p-row"><span>Dhuhr ☀️</span><strong id="time-dhuhr">--:--</strong></div>
        <div class="p-row"><span>Asr ⛅</span><strong id="time-asr">--:--</strong></div>
        <div class="p-row"><span>Maghrib 🌅</span><strong id="time-maghrib">--:--</strong></div>
        <div class="p-row"><span>Isha'a 🌙</span><strong id="time-isha">--:--</strong></div>
    </main>

    <!-- Bottom Features -->
    <div class="quick-features">
        <div class="feat-item"><div class="feat-icon"><i class="fa-solid fa-compass"></i></div><span>Qibla</span></div>
        <div class="feat-item"><div class="feat-icon"><i class="fa-solid fa-book-quran"></i></div><span>Quran</span></div>
        <div class="feat-item"><div class="feat-icon"><i class="fa-solid fa-hands-praying"></i></div><span>Duas</span></div>
        <div class="feat-item"><div class="feat-icon"><i class="fa-solid fa-dhikr"></i></div><span>Tasbih</span></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
