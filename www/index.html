<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE TRUTH OF LIFE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #121212; color: #fff; }
        header { background: #1f1f1f; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; color: #00ff88; }
        .search-container { padding: 10px; text-align: center; }
        input { width: 95%; max-width: 500px; padding: 12px; border-radius: 5px; border: none; outline: none; background: #2a2a2a; color: #fff; font-size: 16px; }
        .nav-tabs { display: flex; background: #1f1f1f; margin-top: 10px; }
        .tab { flex: 1; padding: 12px; text-align: center; background: #2a2a2a; color: #aaa; cursor: pointer; border: none; font-size: 16px; }
        .tab.active { background: #00ff88; color: #000; font-weight: bold; }
        .section { display: none; padding: 15px; }
        .section.active { display: block; }
        .item-card { background: #1f1f1f; padding: 12px; margin-bottom: 10px; border-radius: 5px; border-left: 4px solid #00ff88; }
        .item-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
        .item-sub { font-size: 14px; color: #aaa; }
        audio { width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <header>THE TRUTH OF LIFE</header>

    <div class="search-container">
        <input type="text" id="searchInput" onkeyup="filterItems()" placeholder="Search Surah, Para, or Waz...">
    </div>

    <div class="nav-tabs">
        <button class="tab active" onclick="switchTab('quranTab', this)">Quran</button>
        <button class="tab" onclick="switchTab('wazTab', this)">Waz</button>
    </div>

    <div id="quranTab" class="section active">
        <div id="surahContainer">Loading Surahs...</div>
    </div>

    <div id="wazTab" class="section">
        <div id="wazContainer"></div>
    </div>

    <script>
        let surahData = [];
        const wazData = [
            { title: "Islamic Lecture 1", speaker: "Speaker 1", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
            { title: "Islamic Lecture 2", speaker: "Speaker 2", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" }
        ];

        async function fetchSurahs() {
            try {
                let res = await fetch('https://api.alquran.cloud/v1/surah');
                let data = await res.json();
                surahData = data.data;
                renderSurahs(surahData);
            } catch (err) {
                document.getElementById('surahContainer').innerText = 'Failed to load Quran data.';
            }
        }

        function renderSurahs(list) {
            let container = document.getElementById('surahContainer');
            container.innerHTML = '';
            list.forEach(surah => {
                container.innerHTML += `
                    <div class="item-card searchable">
                        <div class="item-title">${surah.number}. ${surah.englishName} (${surah.name})</div>
                        <div class="item-sub">Meaning: ${surah.englishNameTranslation} | Verses: ${surah.numberOfAyahs}</div>
                    </div>
                `;
            });
        }

        function renderWaz() {
            let container = document.getElementById('wazContainer');
            container.innerHTML = '';
            wazData.forEach(waz => {
                container.innerHTML += `
                    <div class="item-card searchable">
                        <div class="item-title">${waz.title}</div>
                        <div class="item-sub">${waz.speaker}</div>
                        <audio controls src="${waz.url}"></audio>
                    </div>
                `;
            });
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function filterItems() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.querySelectorAll('.searchable');
            cards.forEach(card => {
                let text = card.innerText.toLowerCase();
                card.style.display = text.includes(query) ? 'block' : 'none';
            });
        }

        fetchSurahs();
        renderWaz();
    </script>
</body>
</html>
