<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE TRUTH OF LIFE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-content">
            <h1>THE TRUTH OF LIFE</h1>
            <p id="current-date">Loading Hijri & Gregorian Date...</p>
        </div>
    </header>

    <main class="main-container">
        <!-- Muslim Pro Style Prayer Dashboard -->
        <section class="card prayer-card">
            <div class="card-header">
                <h2>Today's Prayer Times</h2>
            </div>
            <div class="prayer-grid">
                <div class="prayer-box">
                    <span class="p-name">Fajr</span>
                    <strong class="p-time" id="fajr">--:--</strong>
                </div>
                <div class="prayer-box">
                    <span class="p-name">Dhuhr</span>
                    <strong class="p-time" id="dhuhr">--:--</strong>
                </div>
                <div class="prayer-box">
                    <span class="p-name">Asr</span>
                    <strong class="p-time" id="asr">--:--</strong>
                </div>
                <div class="prayer-box">
                    <span class="p-name">Maghrib</span>
                    <strong class="p-time" id="maghrib">--:--</strong>
                </div>
                <div class="prayer-box">
                    <span class="p-name">Isha</span>
                    <strong class="p-time" id="isha">--:--</strong>
                </div>
            </div>
        </section>

        <!-- Quran Surah Reader & Navigation -->
        <section class="card quran-card">
            <div class="reader-nav">
                <button id="prev-btn" onclick="loadPreviousSurah()">❮ Prev</button>
                <h2 id="surah-title">Surah 1</h2>
                <button id="next-btn" onclick="loadNextSurah()">Next ❯</button>
            </div>
            <div id="surah-content" class="content-box">
                <p class="swipe-hint">💡 Swipe left or right to switch Surah</p>
                <div id="verses-container"></div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
